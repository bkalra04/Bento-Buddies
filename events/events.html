<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Food Buddies</title>
    <link rel="stylesheet" href="Events.css">
    <link rel="stylesheet" href="../shared/animations.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="../home/home.html"><button>Home</button></a>
            <a href="../maps/maps.html"><button>Maps</button></a>
            <a href="../events/events.html"><button class="active">Events</button></a>
            <a href="../messages/messages.html"><button>Messages</button></a>
            <a href="../profile/profile.html"><button>Profile</button></a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-bar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255, 255, 255, 0.9)" stroke-width="2" style="margin-right: 10px;">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search an event...">
            </div>
            <div class="red-panda">
                <img src="../Images/Red Panda.png" alt="Red Panda">
            </div>
        </div>

        <!-- Dietary Filter Section -->
        <div class="filter-section">
            <h3 class="filter-title">🥗 Filter by Dietary Preferences</h3>
            <div class="dietary-filters">
                <button class="dietary-filter-btn" data-filter="all">All</button>
                <button class="dietary-filter-btn saved-filter-btn" data-filter="saved">❤️ Saved</button>
                <button class="dietary-filter-btn" data-filter="vegetarian">Vegetarian</button>
                <button class="dietary-filter-btn" data-filter="vegan">Vegan</button>
                <button class="dietary-filter-btn" data-filter="halal">Halal</button>
                <button class="dietary-filter-btn" data-filter="kosher">Kosher</button>
                <button class="dietary-filter-btn" data-filter="gluten-free">Gluten-Free</button>
                <button class="dietary-filter-btn" data-filter="dairy-free">Dairy-Free</button>
                <button class="dietary-filter-btn" data-filter="nut-allergy">Nut Allergy</button>
                <button class="dietary-filter-btn" data-filter="pescatarian">Pescatarian</button>
            </div>
        </div>

        <!-- Advanced Filters Section -->
        <div class="filter-section advanced-filters-section">
            <h3 class="filter-title">🔍 Advanced Filters</h3>
            <div class="advanced-filters">
                <!-- Time of Day Filter -->
                <div class="filter-group">
                    <label>Time of Day:</label>
                    <div class="time-filters">
                        <button class="time-filter-btn active" data-time="all">All</button>
                        <button class="time-filter-btn" data-time="breakfast">🌅 Breakfast (6-11am)</button>
                        <button class="time-filter-btn" data-time="lunch">☀️ Lunch (11am-3pm)</button>
                        <button class="time-filter-btn" data-time="dinner">🌙 Dinner (5-9pm)</button>
                        <button class="time-filter-btn" data-time="late">🌃 Late Night (9pm+)</button>
                    </div>
                </div>

                <!-- Date Range Filter -->
                <div class="filter-group">
                    <label>Date Range:</label>
                    <div class="date-filters">
                        <button class="date-filter-btn active" data-date="all">All</button>
                        <button class="date-filter-btn" data-date="today">Today</button>
                        <button class="date-filter-btn" data-date="week">This Week</button>
                        <button class="date-filter-btn" data-date="month">This Month</button>
                    </div>
                </div>

                <!-- Sort Options -->
                <div class="filter-group">
                    <label>Sort By:</label>
                    <select class="sort-select" id="sortSelect">
                        <option value="date">Date (Soonest First)</option>
                        <option value="spots">Most Spots Available</option>
                        <option value="attendees">Most Attendees</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Happening Today Section -->
        <div class="events-section">
            <h2>Happening Today</h2>
            <div class="carousel-container">
                <div class="carousel" id="todayCarousel">
                    <!-- Events will be dynamically added here -->
                </div>
            </div>
        </div>

        <!-- Future Events Section -->
        <div class="events-section future-section">
            <div class="section-header">
                <h2>Future Events</h2>
                <button class="plan-visit-btn">Plan a Visit</button>
            </div>
            <div class="carousel-container">
                <div class="carousel" id="futureCarousel">
                    <!-- Events will be dynamically added here -->
                </div>
            </div>
        </div>

        <!-- Past Events Section -->
        <div class="events-section past-section">
            <h2>Past Events</h2>
            <div class="carousel-container">
                <div class="carousel" id="pastCarousel">
                    <!-- Past events will be dynamically added here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Event Details Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <img id="modalImage" src="" alt="Event">
            <h2 id="modalTitle"></h2>
            <div class="modal-details">
                <p><strong>📅 Date:</strong> <span id="modalDate"></span></p>
                <p><strong>🕐 Time:</strong> <span id="modalTime"></span></p>
                <p><strong>📍 Location:</strong> <span id="modalLocation"></span></p>
            </div>

            <!-- Group Chat Section (shown only if user is attending) -->
            <div id="groupChatSection" style="display: none; margin-top: 20px; border-top: 2px solid #f0f0f0; padding-top: 20px;">
                <h3 style="margin-bottom: 15px; font-size: 18px;">💬 Group Chat</h3>

                <div id="groupChatMessages" style="
                    max-height: 300px;
                    overflow-y: auto;
                    padding: 15px;
                    background: #f8f8f8;
                    border-radius: 12px;
                    margin-bottom: 15px;
                "></div>

                <div style="display: flex; gap: 10px; align-items: center;">
                    <div style="flex: 1; display: flex; align-items: center; background: white; border: 2px solid #e0e0e0; border-radius: 25px; padding: 10px 15px;">
                        <input type="text" id="groupChatInput" placeholder="Type a message..." style="border: none; outline: none; flex: 1; font-size: 14px;">
                        <input type="file" id="groupChatPhotoInput" accept="image/*" style="display: none;">
                        <button id="groupChatPhotoBtn" style="background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </button>
                    </div>
                    <button id="groupChatSendBtn" style="
                        background: linear-gradient(135deg, #FFB3C6, #FF93A9);
                        border: none;
                        border-radius: 50%;
                        width: 44px;
                        height: 44px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        cursor: pointer;
                        transition: opacity 0.2s;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>

                <!-- Photo Preview -->
                <div id="groupChatPhotoPreview" style="display: none; position: relative; margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 8px;">
                    <img id="groupChatPreviewImage" src="" alt="Preview" style="max-width: 100%; max-height: 150px; border-radius: 8px; display: block;">
                    <button id="removeGroupChatPhotoBtn" style="
                        position: absolute;
                        top: 15px;
                        right: 15px;
                        background: rgba(0, 0, 0, 0.6);
                        color: white;
                        border: none;
                        border-radius: 50%;
                        width: 28px;
                        height: 28px;
                        font-size: 20px;
                        line-height: 1;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">×</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Rating Modal -->
    <div class="modal" id="ratingModal" style="display: none;">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-btn" id="closeRatingModal">&times;</span>
            <h2 style="margin-bottom: 20px;">Rate Attendee</h2>

            <div id="ratingUserInfo" style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px; padding: 15px; background: #f8f8f8; border-radius: 12px;"></div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: 600; margin-bottom: 10px;">Rating</label>
                <div id="starRating" style="display: flex; gap: 10px; font-size: 36px; cursor: pointer;">
                    <span class="star" data-rating="1">☆</span>
                    <span class="star" data-rating="2">☆</span>
                    <span class="star" data-rating="3">☆</span>
                    <span class="star" data-rating="4">☆</span>
                    <span class="star" data-rating="5">☆</span>
                </div>
                <p id="ratingText" style="margin-top: 10px; color: #666; font-size: 14px;">Select a rating</p>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: 600; margin-bottom: 10px;">Review (Optional)</label>
                <textarea id="ratingReview" placeholder="Share your experience..." rows="4" style="
                    width: 100%;
                    padding: 12px;
                    border: 2px solid #e0e0e0;
                    border-radius: 8px;
                    font-family: inherit;
                    font-size: 14px;
                    resize: vertical;
                "></textarea>
            </div>

            <div style="display: flex; gap: 10px;">
                <button id="cancelRatingBtn" style="
                    flex: 1;
                    padding: 12px;
                    background: white;
                    border: 2px solid #ddd;
                    border-radius: 8px;
                    font-weight: 600;
                    cursor: pointer;
                ">Cancel</button>
                <button id="submitRatingBtn" style="
                    flex: 1;
                    padding: 12px;
                    background: linear-gradient(135deg, #FF93A9, #FF8375);
                    color: white;
                    border: none;
                    border-radius: 8px;
                    font-weight: 600;
                    cursor: pointer;
                " disabled>Submit Rating</button>
            </div>
        </div>
    </div>

    <script src="../shared/animations.js"></script>
    <script type="module" src="../src/pages/events.js"></script>
</body>
</html>
