<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - UBC Meetup</title>
    <link rel="stylesheet" href="messages.css">
    <link rel="stylesheet" href="../shared/animations.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="../home/home.html"><button>Home</button></a>
            <a href="../maps/maps.html"><button>Maps</button></a>
            <a href="../events/events.html"><button>Events</button></a>
            <a href="../messages/messages.html"><button class="active">Messages</button></a>
            <a href="../profile/profile.html"><button>Profile</button></a>
        </div>
    </nav>

    <div class="messages-container">
        <div class="contacts-sidebar">
            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search in contacts">
                </div>
                <button class="search-users-btn" id="searchUsersBtn" style="
                    width: 100%;
                    padding: 10px;
                    margin-top: 10px;
                    background: linear-gradient(135deg, #FF93A9, #FF8375);
                    color: white;
                    border: none;
                    border-radius: 8px;
                    cursor: pointer;
                    font-weight: 600;
                    transition: opacity 0.2s;
                ">+ Find Users</button>
            </div>

            <div class="contact-list" id="contactList">
            </div>
        </div>

        <div class="conversation-area">
            <div class="messages-area" id="messagesArea">
            </div>

            <div class="input-area">
                <div class="message-input-container">
                    <input type="text" id="messageInput" placeholder="Type your message">
                    <input type="file" id="photoInput" accept="image/*" style="display: none;">
                    <button class="attachment-btn" id="photoBtn" title="Upload photo">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </button>
                </div>
                <button class="send-btn" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>

            <!-- Photo Preview -->
            <div class="photo-preview" id="photoPreview" style="display: none;">
                <img id="previewImage" src="" alt="Preview">
                <button class="remove-photo-btn" id="removePhotoBtn">×</button>
            </div>
        </div>
    </div>

    <!-- User Profile Modal -->
    <div class="modal" id="userProfileModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);">
        <div class="modal-content" style="background: white; margin: 5% auto; padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; position: relative;">
            <span class="close-btn" id="closeProfileModal" style="position: absolute; top: 20px; right: 25px; font-size: 28px; font-weight: bold; color: #999; cursor: pointer;">&times;</span>
            <div id="profileModalContent"></div>
        </div>
    </div>

    <!-- User Search Modal -->
    <div class="modal" id="userSearchModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);">
        <div class="modal-content" style="background: white; margin: 5% auto; padding: 30px; border-radius: 20px; max-width: 600px; width: 90%; position: relative;">
            <span class="close-btn" id="closeSearchModal" style="position: absolute; top: 20px; right: 25px; font-size: 28px; font-weight: bold; color: #999; cursor: pointer;">&times;</span>
            <h2 style="margin-bottom: 20px;">Find Users</h2>
            <div class="search-box" style="margin-bottom: 20px;">
                <input type="text" id="userSearchInput" placeholder="Search by name..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;">
            </div>
            <div id="searchResults" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <script src="../shared/animations.js"></script>
    <script type="module" src="../src/pages/messages.js"></script>
</body>
</html>
